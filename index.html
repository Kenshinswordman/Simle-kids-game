<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GAMIT Road Safety Mission</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:linear-gradient(#9ee7ff,#fff3c4);font-family:system-ui,sans-serif;color:#172033;text-align:center;touch-action:manipulation}.game{max-width:780px;margin:auto;background:#fff;border:4px solid #172033;border-radius:24px;padding:18px;box-shadow:0 8px 0 #172033}h1{margin:0;color:#d71920;font-size:clamp(1.7rem,6vw,2.8rem)}.brand{font-weight:800;margin-bottom:12px}.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.badge{background:#fff0f0;padding:7px 12px;border-radius:20px;font-weight:800}.scene{height:180px;position:relative;overflow:hidden;margin:15px 0;border-radius:16px;border:3px solid #172033;background:linear-gradient(#8cddff 0 43%,#65c54d 43% 57%,#454545 57% 100%)}.road{position:absolute;left:0;right:0;bottom:29px;height:6px;background:repeating-linear-gradient(90deg,#fff 0 38px,transparent 38px 72px)}.crosswalk{position:absolute;right:20%;bottom:0;width:105px;height:65px;background:repeating-linear-gradient(0deg,#fff 0 8px,transparent 8px 17px)}.hero{position:absolute;left:8%;bottom:70px;font-size:3rem;transition:left .55s,bottom .3s}.hero i{position:absolute;left:18px;top:4px;background:#d71920;color:#fff;border:2px solid #fff;border-radius:50%;font:bold 1rem Arial;padding:2px;font-style:normal}.sign{position:absolute;right:5%;top:10px;background:#172033;color:white;padding:7px 10px;border-radius:8px;font-weight:800}.question{font-size:1.2rem;font-weight:800;min-height:54px;margin:12px 0}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}button{border:0;border-radius:13px;padding:13px 16px;font:inherit;font-weight:800;color:#fff;background:#2563eb;box-shadow:0 4px 0 #173d9b;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #173d9b}button:disabled{opacity:.55;cursor:not-allowed}.feedback{min-height:48px;margin:15px 0;font-weight:800}.good{color:#13823a}.try{color:#c32626}.progress{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:10px 0 16px}.progress b{display:block;height:100%;width:0;background:#16a34a;transition:width .3s}.next,.restart{display:none;background:#16a34a;box-shadow:0 4px 0 #08752c;margin:2px auto}.lesson{font-size:.9rem;color:#596273;margin:16px 0 0}.hidden{display:none!important}
</style>
</head>
<body>
<main class="game">
<h1>🚦 GAMIT Road Safety Mission</h1><div class="brand">Emergency Solution • Learn, play and stay safe</div>
<div class="badges"><span class="badge">🏅 Safety points: <b id="score">0</b></span><span class="badge">Mission <b id="number">1</b>/6</span></div>
<div class="progress"><b id="bar"></b></div>
<section class="scene" aria-label="Road safety learning scene"><div class="sign" id="sign">STOP</div><div class="crosswalk"></div><div class="road"></div><div class="hero" id="hero">🦸<i>G</i></div></section>
<div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">Next mission ➡️</button><button class="restart" id="restart">Play again 🔁</button>
<p class="lesson">Safety rule: <b>Stop • Look left and right • Listen • Think • Cross safely</b></p>
</main>
<script>
const missions=[
{q:'You reach a road. What is your first action?',a:['Stop at the kerb','Run across'],ok:0,tip:'Stop at the kerb before doing anything else.'},
{q:'Where is the safest place to cross?',a:['At a marked crosswalk','Between parked cars'],ok:0,tip:'Use a marked crosswalk or a crossing supervised by an adult.'},
{q:'Which way should you look before crossing?',a:['Left, right, then left again','Only straight ahead'],ok:0,tip:'Look left, right, then left again and keep watching while crossing.'},
{q:'The walk signal is red. What should you do?',a:['Wait for the green walk signal','Cross if no car is close'],ok:0,tip:'Wait for the safe walking signal. A signal helps, but still look and listen.'},
{q:'A ball rolls into the street. What is safest?',a:['Ask a trusted adult for help','Chase it quickly'],ok:0,tip:'Never chase a ball into traffic. Ask a trusted adult.'},
{q:'What should you do in a moving car?',a:['Wear your seat belt','Stand on the seat'],ok:0,tip:'Always buckle up and stay seated until the car stops.'}
];
let n=0,score=0,locked=false;const $=id=>document.getElementById(id),q=$('question'),answers=$('answers'),feedback=$('feedback'),hero=$('hero'),sign=$('sign');
function show(){let m=missions[n];locked=false;$('number').textContent=n+1;$('bar').style.width=(n/6*100)+'%';q.textContent=m.q;feedback.textContent='';feedback.className='feedback';$('next').style.display='none';answers.innerHTML='';sign.textContent=n===0?'STOP':n===3?'WAIT':'LOOK';hero.style.left='8%';m.a.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>choose(i);answers.appendChild(b)})}
function choose(i){if(locked)return;locked=true;let m=missions[n];[...answers.children].forEach(b=>b.disabled=true);if(i===m.ok){score++;$('score').textContent=score;feedback.textContent='✅ Correct! '+m.tip;feedback.className='feedback good';hero.style.left='72%';sign.textContent='SAFE'}else{feedback.textContent='💡 Try again next time. '+m.tip;feedback.className='feedback try'}if(n<missions.length-1)$('next').style.display='inline-block';else finish()}
$('next').onclick=()=>{n++;show()};function finish(){q.textContent=score===6?'🏆 Road Safety Champion!':'Mission complete!';answers.innerHTML='';$('bar').style.width='100%';feedback.textContent=`You earned ${score}/6 safety points. Remember these rules at every road.`;feedback.className='feedback '+(score>=4?'good':'try');$('restart').style.display='inline-block';$('next').style.display='none'}
$('restart').onclick=()=>{n=0;score=0;$('score').textContent=0;$('restart').style.display='none';show()};show();
</script>
</body>
</html>
